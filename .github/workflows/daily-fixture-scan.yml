name: Daily POLYEDGE fixture scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Fetch and scan upcoming fixtures
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python scripts/daily_fixture_scan.py
      - name: Upload fixture scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyedge-fixture-scan-${{ github.run_number }}
          path: fixture-scan-report.json
          if-no-files-found: ignore
          retention-days: 14
